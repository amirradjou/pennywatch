[project]
name = "pennywatch"
version = "0.1.0"
description = "An independent performance monitor for PennyLane, Lightning and Catalyst"
authors = [
    { name = "amirradjou", email = "amir.radical.78@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pennywatch = "pennywatch.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
